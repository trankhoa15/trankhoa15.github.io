        <!-- GÓC PHẢI: Nút Đăng nhập / Đăng ký -->
<style>
    .auth-buttons {
        position: fixed;
        top: 15px;
        right: 25px;
        display: flex;
        gap: 10px;
        z-index: 9999;
    }
    .auth-buttons button {
        background-color: #0077b6;
        border: none;
        padding: 8px 14px;
        color: white;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
    }
    .auth-buttons button:hover {
        opacity: 0.85;
    }

    /* POPUP */
    .popup-bg {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        justify-content: center;
        align-items: center;
        z-index: 10000;
    }
    .popup-box {
        background: white;
        width: 350px;
        border-radius: 10px;
        padding: 20px;
        box-shadow: 0 0 10px rgba(0,0,0,0.3);
        animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }

    .popup-box input {
        width: 100%;
        padding: 7px;
        margin-top: 8px;
        margin-bottom: 14px;
        margin-left: -10px;
        border: 1px solid #ccc;
        border-radius: 6px;
    }

    .popup-box button {
        width: 105%;
        padding: 10px;
        margin-left: -10px;
        background: #0077b6;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }
</style>

<!-- NÚT -->
<div class="auth-buttons">
    <button onclick="openPopup('login')">Đăng nhập</button>
    <button onclick="openPopup('register')">Đăng ký</button>
</div>

<!-- POPUP -->
<div id="popup" class="popup-bg">
    <div class="popup-box">
        <h3 id="popup-title">Đăng nhập</h3>

        <input type="email" id="email" placeholder="Email">

        <!-- Trường chỉ hiện khi Đăng ký -->
        <input type="text" id="username" placeholder="Tên đăng nhập" style="display:none;">
        <input type="tel" id="phone" placeholder="Số điện thoại" style="display:none;">

        <input type="password" id="password" placeholder="Mật khẩu">
        <input type="password" id="password2" placeholder="Xác nhận mật khẩu" style="display:none;">

        <button onclick="submitForm()">Xác nhận</button>
        <p style="color:red; margin-top:10px;" id="error-msg"></p>
    </div>
</div>

<script>
    let mode = "login";

    function openPopup(type) {
        mode = type;
        document.getElementById("popup-title").innerText =
            type === "login" ? "Đăng nhập" : "Đăng ký tài khoản";

        // Reset input
        ["email","username","phone","password","password2"].forEach(id => {
            document.getElementById(id).value = "";
        });

        // Reset lỗi
        document.getElementById("error-msg").innerText = "";

        // Ẩn/hiện các trường
        const show = type === "register" ? "block" : "none";
        document.getElementById("username").style.display = show;
        document.getElementById("phone").style.display = show;
        document.getElementById("password2").style.display = show;

        // Mở popup
        document.getElementById("popup").style.display = "flex";
    }

    // Click ra ngoài để đóng
    window.onclick = function(e) {
        if (e.target.id === "popup") {
            document.getElementById("popup").style.display = "none";
        }
    }

    function submitForm() {
        const email = document.getElementById("email").value.trim();
        const username = document.getElementById("username").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const password = document.getElementById("password").value.trim();
        const password2 = document.getElementById("password2").value.trim();

        const error = document.getElementById("error-msg");

        const emailRegex = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;
        const phoneRegex = /^[0-9]{9,11}$/;

        if (!email || !password || (mode==="register" && (!username || !phone || !password2))) {
            error.innerText = "Vui lòng nhập đầy đủ thông tin.";
            return;
        }

        if (!emailRegex.test(email)) {
            error.innerText = "Email không hợp lệ.";
            return;
        }

        if (mode === "register" && !phoneRegex.test(phone)) {
            error.innerText = "Số điện thoại không hợp lệ.";
            return;
        }

        if (password.length < 6) {
            error.innerText = "Mật khẩu phải có ít nhất 6 ký tự.";
            return;
        }

        if (mode === "register" && password !== password2) {
            error.innerText = "Mật khẩu xác nhận không khớp.";
            return;
        }

        alert(mode === "login" ? "Đăng nhập thành công!" : "Đăng ký thành công!");
        document.getElementById("popup").style.display = "none";
    }
</script>
